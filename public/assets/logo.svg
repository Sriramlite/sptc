<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2558" />
      <stop offset="50%" stop-color="#143e8a" />
      <stop offset="100%" stop-color="#071b40" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE076" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  
  <!-- Outer Gold Laurel Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="10 4"/>
  <circle cx="100" cy="100" r="86" fill="url(#shieldGrad)" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Academic Shield Shape -->
  <path d="M 60 45 L 140 45 Q 140 100 100 135 Q 60 100 60 45 Z" fill="#ffffff" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Emblem Center: Gear + Book + Torch -->
  <!-- Gear -->
  <circle cx="100" cy="85" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="85" r="14" fill="#0a2558" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="100" y1="56" x2="100" y2="114" stroke="url(#goldGrad)" stroke-width="4"/>
  <line x1="71" y1="85" x2="129" y2="85" stroke="url(#goldGrad)" stroke-width="4"/>
  <line x1="80" y1="65" x2="120" y2="105" stroke="url(#goldGrad)" stroke-width="3"/>
  <line x1="80" y1="105" x2="120" y2="65" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Open Book at base of shield -->
  <path d="M 80 112 Q 100 108 100 116 Q 100 108 120 112 L 120 126 Q 100 121 100 128 Q 100 121 80 126 Z" fill="url(#goldGrad)"/>
  
  <!-- Stars -->
  <polygon points="100,24 103,32 111,32 105,37 107,45 100,40 93,45 95,37 89,32 97,32" fill="url(#goldGrad)"/>
  
  <!-- Banner Ribbons with text -->
  <path d="M 35 155 Q 100 142 165 155 L 160 172 Q 100 159 40 172 Z" fill="#071b40" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="100" y="166" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FCE076" text-anchor="middle" letter-spacing="1.5">SPTC • ESTD 1983</text>
  
  <!-- Top Circular Text Curved Indicator -->
  <text x="100" y="40" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">RAYAVARAM</text>
</svg>
